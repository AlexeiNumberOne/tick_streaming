name: CI

on: [push, pull_request]

jobs:
  unit-tests:
      name: Unit Tests (Fast)
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'
        - run: pip install -r requirements-dev.txt
        - name: Run Unit tests only
          run: pytest -m unit
